<svg width="700" height="640" viewBox="0 0 700 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Class diagram showing MyLinearRegression2 inheriting from sklearn's LinearRegression, overriding fit while inheriting predict and score">
  <title>MyLinearRegression2(LinearRegression): overriding fit, inheriting predict and score</title>
  <defs>
    <marker id="lri-inherit-arrow" markerWidth="22" markerHeight="18" refX="19" refY="9"
            orient="auto-start-reverse">
      <path d="M1,1 L20,9 L1,17 z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    </marker>
  </defs>

  <text x="350" y="32" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="20" font-weight="bold" fill="#2b2b2b">class MyLinearRegression2(LinearRegression):</text>

  <!-- parent class box: LinearRegression -->
  <rect x="140" y="60" width="420" height="230" rx="8" fill="#eaf1fb" stroke="#3f6fa8" stroke-width="3"/>
  <line x1="140" y1="102" x2="560" y2="102" stroke="#3f6fa8" stroke-width="2"/>
  <text x="350" y="87" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="19" font-weight="bold" fill="#254a75">LinearRegression</text>
  <text x="350" y="61" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="0" fill="#254a75"></text>
  <text x="160" y="98" text-anchor="start" font-family="Helvetica, Arial, sans-serif"
        font-size="13" font-style="italic" fill="#5a7fa8">(parent class / superclass)</text>

  <text x="160" y="128" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#5a7fa8">Attributes</text>
  <text x="175" y="150" font-family="Menlo, Consolas, monospace" font-size="16" fill="#2b2b2b">coef_</text>
  <text x="175" y="172" font-family="Menlo, Consolas, monospace" font-size="16" fill="#2b2b2b">intercept_</text>

  <text x="160" y="198" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#5a7fa8">Methods</text>
  <text x="175" y="220" font-family="Menlo, Consolas, monospace" font-size="16" fill="#2b2b2b">fit(X, y)</text>
  <text x="175" y="242" font-family="Menlo, Consolas, monospace" font-size="16" fill="#2b2b2b">predict(X)</text>
  <text x="175" y="264" font-family="Menlo, Consolas, monospace" font-size="16" fill="#2b2b2b">score(X, y), ...</text>

  <!-- inheritance arrow (UML generalization: hollow triangle points at the superclass) -->
  <line x1="350" y1="378" x2="350" y2="293" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#lri-inherit-arrow)"/>
  <text x="400" y="345" text-anchor="start" font-family="Helvetica, Arial, sans-serif"
        font-size="15" font-style="italic" fill="#2b2b2b">inherits from</text>
  <text x="400" y="364" text-anchor="start" font-family="Helvetica, Arial, sans-serif"
        font-size="13" font-style="italic" fill="#666666">(is a LinearRegression)</text>

  <!-- child class box: MyLinearRegression2 -->
  <rect x="140" y="380" width="420" height="190" rx="8" fill="#fbeaea" stroke="#a8324a" stroke-width="3"/>
  <line x1="140" y1="422" x2="560" y2="422" stroke="#a8324a" stroke-width="2"/>
  <text x="350" y="407" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="19" font-weight="bold" fill="#7a2138">MyLinearRegression2</text>
  <text x="160" y="418" text-anchor="start" font-family="Helvetica, Arial, sans-serif"
        font-size="13" font-style="italic" fill="#b06a7a">(child class / subclass)</text>

  <text x="160" y="448" font-family="Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#5a7fa8">Methods</text>
  <text x="175" y="472" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="bold" fill="#a8324a">fit(X, y)</text>
  <text x="320" y="472" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#a8324a">&#8592; overridden</text>

  <text x="160" y="502" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#777777">Inherited from LinearRegression (not redefined):</text>
  <text x="175" y="526" font-family="Menlo, Consolas, monospace" font-size="16" fill="#777777">predict(X)</text>
  <text x="175" y="548" font-family="Menlo, Consolas, monospace" font-size="16" fill="#777777">score(X, y)</text>

  <!-- legend -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2b2b2b">
    <rect x="140" y="600" width="16" height="16" fill="#a8324a"/>
    <text x="164" y="613">overridden method (redefined in the subclass)</text>
    <rect x="140" y="624" width="16" height="16" fill="#bbbbbb"/>
    <text x="164" y="637">inherited method (found by Python in the parent class)</text>
  </g>
</svg>
